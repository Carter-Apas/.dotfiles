# Generated by theme; edit desktop-theme/palettes instead.
[global]
    frame_color = "{{border}}"

[urgency_low]
    background = "{{bg}}"
    foreground = "{{muted}}"
    frame_color = "{{border}}"
    highlight = "{{accent}}"

[urgency_normal]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{accent}}"
    highlight = "{{accent}}"

[urgency_critical]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{red}}"
    highlight = "{{red}}"

# WezTerm marks every terminal notification as critical and never-expiring.
# Changing urgency does not reapply the urgency_normal colours or pause level.
[wezterm-normal]
    appname = "wezterm"
    urgency = normal
    override_dbus_timeout = 10
    override_pause_level = 30
    frame_color = "{{accent}}"
    highlight = "{{accent}}"
